<!DOCTYPE html>
<html>
<head>
    <title>FPL Players</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>FPL Players - Surnames & xG</h1>
    <table>
        <tr>
            <th>Surname</th>
            <th>xG</th>
        </tr>
        <tbody id="playerTable"></tbody>
    </table>

    <script>
        fetch('http://localhost:8000/json')
            .then(response => response.json())
            .then(data => {
                // Create array of player objects
                let players = [];
                for (let i = 0; i < data.second_names.length; i++) {
                    players.push({
                        name: data.second_names[i],
                        xg: data.xg[i]
                    });
                }

                // Sort by xG descending (highest first)
                players.sort((a, b) => b.xg - a.xg);

                // Build the table
                const tableBody = document.getElementById('playerTable');
                for (let player of players) {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${player.name}</td>
                        <td>${player.xg}</td>
                    `;
                    tableBody.appendChild(row);
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('playerTable').innerHTML = '<tr><td colspan="2">Failed to load data</td></tr>';
            });
    </script>
</body>
</html>
